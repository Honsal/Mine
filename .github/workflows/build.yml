name: Build

on:
  push:
    branches: [ main, "copilot/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore 1.6/Source/MinesAutomated.sln

      - name: Build
        run: dotnet build 1.6/Source/MinesAutomated.sln --configuration Release --no-restore

      - name: Upload Assemblies
        uses: actions/upload-artifact@v4
        with:
          name: assemblies
          path: 1.6/Source/**/bin/Release/net472/*.dll
