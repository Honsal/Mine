name: Build

on:
  push:
    branches: [ main, "copilot/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore 1.6/Source/MinesAutomated.sln

      - name: Build
        run: dotnet build 1.6/Source/MinesAutomated.sln --configuration Release --no-restore

      - name: Summarize built DLL metadata
        run: |
          set -euo pipefail
          main_dll="1.6/Source/MinesAutomated/bin/Release/net472/MinesAutomated.dll"
          ext_dll="1.6/Source/MinesAutomatedExtension/bin/Release/net472/MinesAutomatedExtension.dll"
          [[ -f "$main_dll" ]] || { echo "Missing DLL: $main_dll" >&2; exit 1; }
          [[ -f "$ext_dll" ]] || { echo "Missing DLL: $ext_dll" >&2; exit 1; }
          echo "## Built DLL Metadata Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "| DLL | Project | Size (bytes) | SHA256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | ---: | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MinesAutomated.dll | MinesAutomated | $(stat -c%s "$main_dll") | $(sha256sum "$main_dll" | cut -d' ' -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MinesAutomatedExtension.dll | MinesAutomatedExtension | $(stat -c%s "$ext_dll") | $(sha256sum "$ext_dll" | cut -d' ' -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Assemblies
        uses: actions/upload-artifact@v4
        with:
          name: assemblies
          path: 1.6/Source/**/bin/Release/net472/*.dll
